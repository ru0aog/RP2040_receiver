  <title
     id="title">Тороидальный сердечник с однослойной обмоткой и размерами D, d и H</title>
  <desc
     id="desc">Объёмная условная схема кольцевого сердечника. D — наружный диаметр, d — внутренний диаметр отверстия, H — высота сердечника. Медные линии показывают равномерно распределённые витки; на передних стенках показаны видимые участки провода.</desc>
